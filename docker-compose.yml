# Local development: hot reload for both apps.
# Database + auth come from Supabase (hosted project or `supabase start`), see README.
name: hack

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Everything in .env (LLM and Langfuse keys, ...) reaches the backend.
    env_file: .env
    environment:
      # The browser and the container may need different URLs for local Supabase.
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL:-${SUPABASE_URL:?set SUPABASE_URL in .env}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?set SUPABASE_SECRET_KEY in .env}
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    # Lets the container reach `supabase start` on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
