# Local development with hot reload. Start it with `./hack dev`, which starts
# local Supabase first and passes its URL and keys in as environment variables.
name: hack

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # LLM and Langfuse keys etc.
    env_file: .env
    environment:
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL:?start the stack with ./hack dev}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?start the stack with ./hack dev}
      # Windows: file events don't reach containers, so poll (set by ./hack dev).
      WATCHFILES_FORCE_POLLING: ${WATCH_POLLING:-}
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    # Lets the container reach Supabase on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_SUPABASE_URL: ${SUPABASE_URL:?start the stack with ./hack dev}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?start the stack with ./hack dev}
      WATCH_POLLING: ${WATCH_POLLING:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
