name: CI

on:
  push:
    branches: [main]
    # Docs, agent skills and the shared team .env don't change what's deployed.
    paths-ignore: ["**.md", "docs/**", ".agents/**", ".claude/**", ".env.age"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in step with the minimum in scripts/hack.py (`./hack setup` installs it).
  SUPABASE_CLI_VERSION: 3.2.0
  # Supabase containers the tests don't need.
  SUPABASE_EXCLUDE: edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend
          enable-cache: true
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Local Supabase (Postgres, Auth, REST) with supabase/migrations applied.
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - name: Lint and test
        working-directory: backend
        env:
          RUN_SUPABASE_TESTS: "1"
        run: |
          eval "$(supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.secret_key=SUPABASE_SECRET_KEY)"
          export SUPABASE_URL SUPABASE_SECRET_KEY
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsc -b (app, vite config, e2e tests) + vite build
      - run: npm run build

  # Browser tests against the real stack (Vite + FastAPI + local Supabase).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # The ./hack wrappers on the platforms teammates use: the wrapper installs uv
  # if it's missing, then the CLI runs; plus the CLI's own unit tests.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Windows'
        run: .\hack.cmd doctor
      - if: runner.os != 'Windows'
        run: ./hack doctor
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run --python 3.13 --with pytest pytest scripts -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Only once production exists: `./hack deploy` creates DEMO_DOMAIN. Before
  # that there's nothing to ship, so don't fill the package registry.
  images:
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEMO_DOMAIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          target: prod
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Runs once `terraform apply` (./hack deploy) has created the DEMO_DOMAIN variable
  # and the secrets below.
  deploy:
    needs: [images, terraform]
    if: vars.DEMO_DOMAIN != ''
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ vars.DEMO_DOMAIN }}
    concurrency: deploy-demo
    permissions:
      contents: read
      packages: read # lets the server pull private images with GITHUB_TOKEN
    env:
      DOMAIN: ${{ vars.DEMO_DOMAIN }}
      # Set by Terraform when the DNS record is Cloudflare-proxied.
      SSH_HOST: ${{ vars.DEPLOY_HOST || vars.DEMO_DOMAIN }}
      PROD_ENV: ${{ secrets.PROD_ENV }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push --yes

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Wait for server provisioning
        run: ssh "root@$SSH_HOST" 'cloud-init status --wait >/dev/null; docker compose version'

      - name: Upload compose files and config
        run: |
          {
            printf '%s\n' "$PROD_ENV"
            echo "DOMAIN=$DOMAIN"
            echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "IMAGE_TAG=$GITHUB_SHA"
          } > app.env
          scp deploy/docker-compose.prod.yml "root@$SSH_HOST:/opt/app/docker-compose.yml"
          scp deploy/Caddyfile "root@$SSH_HOST:/opt/app/Caddyfile"
          scp app.env "root@$SSH_HOST:/opt/app/.env"
          ssh "root@$SSH_HOST" chmod 600 /opt/app/.env

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "root@$SSH_HOST" docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ssh "root@$SSH_HOST" 'cd /opt/app && docker compose pull && docker compose up -d --remove-orphans; s=$?; docker logout ghcr.io; docker image prune -f; exit $s'

      - name: Smoke test
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/api/health" | tee /dev/stderr | grep -q '"database":"ok"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
