[project]
name = "backend"
version = "0.1.0"
description = "Hackathon API"
requires-python = ">=3.13"
dependencies = [
    "anthropic-haystack>=8.1.0",
    "fastapi>=0.165.0",
    "google-genai-haystack>=7.2.2",
    "haystack-ai>=3.5.0",
    "langfuse-haystack>=8.0.0",
    "pydantic-settings>=2.16.3",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Raised inside supabase-py itself, not by our code.
filterwarnings = ["ignore:The '(timeout|verify)' parameter is deprecated:DeprecationWarning"]
